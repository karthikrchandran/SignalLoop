name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/skills/**"
      - "_bmad/**"
      - "_bmad-output/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".github/skills/**"
      - "_bmad/**"
      - "_bmad-output/**"

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PROJECT_NAME: SignalLoop
      POSTGRES_SERVER: localhost
      POSTGRES_USER: ci
      POSTGRES_DB: signalloop_ci
      FIRST_SUPERUSER: ci@example.com
      FIRST_SUPERUSER_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install backend dependencies
        run: uv sync --package app --directory apps/api
      - name: Ruff
        run: uv run --package app --directory apps/api ruff check app
      - name: Mypy advisory
        continue-on-error: true
        run: uv run --package app --directory apps/api mypy app
      - name: Pytest
        run: uv run --package app --directory apps/api pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm --workspace frontend run lint
      - name: Build frontend
        run: npm --workspace frontend run build
