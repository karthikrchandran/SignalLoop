name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install backend dependencies
        run: uv sync --package app --directory apps/api
      - name: Ruff
        run: uv run --package app --directory apps/api ruff check app
      - name: Mypy
        run: uv run --package app --directory apps/api mypy app
      - name: Pytest
        run: uv run --package app --directory apps/api pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Lint frontend
        run: npm --workspace frontend run lint
      - name: Build frontend
        run: npm --workspace frontend run build
