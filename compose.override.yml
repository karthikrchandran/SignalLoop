services:
  db:
    restart: no

  redis:
    restart: no

  api:
    restart: no
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      mailpit:
        condition: service_started
      ollama:
        condition: service_started
      stt:
        condition: service_started
    command:
      - fastapi
      - run
      - --reload
      - --port
      - "8001"
      - app/main.py
    develop:
      watch:
        - path: ./apps/api
          action: sync
          target: /app/apps/api
          ignore:
            - ./apps/api/.venv
            - .venv
        - path: ./apps/api/pyproject.toml
          action: rebuild
    volumes:
      - ./apps/api/htmlcov:/app/apps/api/htmlcov
    environment:
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      SMTP_USE_TLS: "false"
      SMTP_USE_STARTTLS: "false"
      EMAILS_FROM_EMAIL: noreply@example.com
      SMTP_FROM_EMAIL: noreply@example.com
      SMTP_FROM_NAME: EngageHub Demo
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
      FASTER_WHISPER_BASE_URL: http://stt:9000
      FASTER_WHISPER_MODEL: base

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1025:1025"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: "no"

  stt:
    build:
      context: ./tooling/stt_service
      dockerfile: Dockerfile
    ports:
      - "9000:9000"
    environment:
      WHISPER_MODEL: base
      WHISPER_DEVICE: cpu
      WHISPER_COMPUTE_TYPE: int8
    restart: "no"

  web:
    restart: no
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: http://localhost:8001
        NODE_ENV: development

  playwright:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.playwright
      args:
        VITE_API_URL: http://api:8001
        NODE_ENV: production
    ipc: host
    depends_on:
      - api
      - mailpit
    env_file:
      - .env
    environment:
      - VITE_API_URL=http://api:8001
      - MAILCATCHER_HOST=http://mailpit:8025
      - MAILPIT_HOST=http://mailpit:8025
      - PLAYWRIGHT_HTML_HOST=0.0.0.0
      - CI=${CI}
    volumes:
      - ./apps/web/blob-report:/app/blob-report
      - ./apps/web/test-results:/app/test-results
    ports:
      - 9323:9323

  sequence-worker:
    restart: no
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
      stt:
        condition: service_started
    environment:
      POSTGRES_SERVER: db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
      FASTER_WHISPER_BASE_URL: http://stt:9000
      FASTER_WHISPER_MODEL: base

  call-worker:
    restart: no
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
      stt:
        condition: service_started
    environment:
      POSTGRES_SERVER: db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
      FASTER_WHISPER_BASE_URL: http://stt:9000
      FASTER_WHISPER_MODEL: base

  postcall-worker:
    restart: no
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      ollama:
        condition: service_started
      stt:
        condition: service_started
    environment:
      POSTGRES_SERVER: db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: llama3.2:1b
      FASTER_WHISPER_BASE_URL: http://stt:9000
      FASTER_WHISPER_MODEL: base

volumes:
  ollama_data:
