[project]
name = "engagehub-workers"
version = "0.1.0"
description = "Background workers for EngageHub"
requires-python = ">=3.10,<4.0"
dependencies = [
    "redis[hiredis]>=6.4.0,<7.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.3,<8.0.0",
    "ruff>=0.2.2,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
