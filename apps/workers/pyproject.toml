[project]
name = "engagehub-workers"
version = "0.1.0"
description = "Background workers for EngageHub"
requires-python = ">=3.10,<4.0"
dependencies = [
    "redis[hiredis]>=6.4.0,<7.0.0",
    "pydantic-settings>=2.2.1,<3.0.0",
    "apscheduler>=3.10,<4.0",
    "sqlmodel>=0.0.21,<1.0.0",
    "psycopg[binary]>=3.1.13,<4.0.0",
    "httpx>=0.25.1,<1.0.0",
    "cryptography>=44.0,<45.0",
    "tzdata>=2024.1",
    "app",
]

[tool.uv.sources]
app = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=7.4.3,<8.0.0",
    "ruff>=0.2.2,<1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["worker_app"]
