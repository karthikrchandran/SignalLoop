<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBH-S08 - Bot Settings</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="mockup-shell">
    <aside class="sidebar"><div class="brand">SignalLoop</div><div class="nav-title">Chatbot</div><div class="nav-item">Channels</div><div class="nav-item">Knowledge Base</div><div class="nav-item">Inbox <span class="badge-count">3</span></div><div class="nav-item">Analytics</div><div class="nav-item active">Settings</div></aside>
    <main class="main">
      <section class="topline">
        <div><p class="eyebrow">CBH-S08</p><h1>Bot Settings</h1><p class="subhead">Configure safe workspace defaults for AI disclosure, lead capture, business hours, and retention.</p></div>
      </section>
      <section class="card">
        <div class="settings-section"><h2 class="card-title">AI and Disclosure</h2><div class="settings-grid" style="margin-top:14px;"><div class="field"><label>AI disclosure text</label><input class="input" value="I'm an AI assistant." /></div><div class="field"><label>Token cap per session</label><input class="input" value="4000" /></div></div></div>
        <div class="settings-section"><h2 class="card-title">Lead Capture</h2><div class="settings-grid" style="margin-top:14px;"><div class="field"><label>Minimum turns before trigger</label><input class="input" value="3" /></div><div class="field"><label>Intent keywords</label><input class="input" value="demo, pricing, buy" /></div><div class="field" style="grid-column:1 / -1;"><label>Privacy policy URL</label><input class="input" value="https://acme.com/privacy" /></div></div></div>
        <div class="settings-section"><h2 class="card-title">Business Hours</h2><div class="settings-grid" style="margin-top:14px;"><div class="field"><label>Timezone</label><select class="select"><option>Asia/Singapore</option></select></div><div class="field"><label>Hours</label><input class="input" value="Mon-Fri, 09:00-18:00" /></div><div class="field" style="grid-column:1 / -1;"><label>Out-of-hours message</label><textarea class="textarea">Our team is offline. I can still help now, or a human will follow up when we are back.</textarea></div></div></div>
        <div class="settings-section"><h2 class="card-title">Compliance</h2><div class="settings-grid" style="margin-top:14px;"><div class="field"><label>Conversation retention days</label><input class="input" value="90" /></div><div class="field"><label>Opt-out management</label><button class="button">Open Settings Opt-outs tab</button></div></div></div>
        <div class="sticky-save"><strong>You have unsaved changes.</strong><div class="actions"><button class="button">Discard</button><button class="button primary">Save Changes</button></div></div>
      </section>
    </main>
  </div>
</body>
</html>
